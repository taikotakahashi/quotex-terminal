[project]
name = "quotex-web-api"
version = "0.1.0"
description = "Read-only FastAPI service exposing the feed's Redis data (REST + WS)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0,<6.0",
]

[project.scripts]
quotex-api = "webapi.main:cli"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webapi"]
