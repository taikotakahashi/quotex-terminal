[project]
name = "quotex-telegram-bot"
version = "0.1.0"
description = "Telegram notification worker: link website accounts and push signals from Redis."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.scripts]
quotex-telegram = "tgbot.main:cli"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgbot"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
