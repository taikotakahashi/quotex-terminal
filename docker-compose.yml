services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: quotex-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: quotex-postgres
    environment:
      POSTGRES_USER: quotex
      POSTGRES_PASSWORD: quotex
      POSTGRES_DB: quotex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotex -d quotex"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Local email catcher (SMTP :1025, UI http://localhost:8025). No domain needed.
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: quotex-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  redis-data:
  postgres-data:
